<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人主页</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1><a href="./">个人主页</a></h1>
      <nav>
        <a href="./">首页</a>
        <a href="blog/">博客</a>
      </nav>
    </header>

    <section>
      <p>欢迎来到我的小站。这里放一些文章的索引，以及一点经历。</p>
    </section>

    <section>
      <h2>最近的文章</h2>
      <p class="muted">完整列表见 <a href="blog/">博客</a>。</p>
    </section>

    <section>
      <h2>经历</h2>
      <ul class="plain">
        <li class="muted">待补充</li>
      </ul>
    </section>

    <section>
      <h2>联系</h2>
      <p>欢迎交个朋友，邮件随时可以写：<a href="mailto:your-email@example.com">your-email@example.com</a></p>
    </section>

    <footer>
      <p>纯静态页面，由 GitHub Pages 发布。</p>
    </footer>
  </div>
</body>
</html>
